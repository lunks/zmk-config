# Dongle options. Display and sleep options of corneish_zen.conf don't apply.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 2M PHY on the split links: halves are 2M-capable in dongle mode (explicit y overrides the default-n of EXPERIMENTAL_CONN)
CONFIG_BT_CTLR_PHY_2M=y

# Peripheral latency 99 at the 7.5 ms interval: idle halves wake ~every 750 ms instead of ~230 ms,
# a key press still goes out at the next connection event (7.5 ms), so typing latency is unchanged.
# Supervision timeout stays 4 s (> (1+99)*7.5ms*2 = 1.5 s)
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=99

# Port of zmk#3377: drop a stale split bond instead of looping on PIN_OR_KEY_MISSING (see Kconfig)
CONFIG_ZEN_SPLIT_AUTO_UNPAIR_ON_KEY_MISMATCH=y
